<script>window.MR_REVIEWS = [ { nombre: 'Lucía M.', fecha: '2026-10-27', estrellas: 5, destacada: true, verificada: true, perfil: 'Corredora · 21K', pack: 'Pack x20', titulo: 'Mi primer 21K sin ampollas', texto: 'Siempre terminaba los fondos largos con el segundo dedo destrozado. Me puse las fundas desde el km 1 en la Media de Buenos Aires y llegué a la meta con los pies enteros. No se movieron en toda la carrera y ni me acordé de que las tenía puestas.' }, { nombre: 'Martín G.', fecha: '2026-10-22', estrellas: 5, verificada: true, perfil: 'Maratonista', pack: 'Pack x30', titulo: 'Chau uña negra', texto: 'Antes de cada maratón perdía una uña, ya lo tenía asumido. Este ciclo usé la funda en el dedo gordo y los parches en el talón. Llegué a la carrera sin una marca. Compré el x30 para compartir con dos amigos del team.' }, { nombre: 'Carolina R.', fecha: '2026-10-19', estrellas: 5, verificada: true, perfil: 'Camina todos los días', pack: 'Pack x10', texto: 'Hago 8 km por día y el meñique siempre me rozaba. Me la pongo en un segundo y no se nota dentro de la zapatilla.' }, { nombre: 'Diego F.', fecha: '2026-10-14', estrellas: 4, verificada: true, perfil: 'Trail', pack: 'Pack x20', titulo: 'Las bajadas ya no son un castigo', texto: 'En las bajadas el pie se me iba para adelante y terminaba con los dedos golpeados. Con las fundas la diferencia es enorme. Le pongo 4 porque al principio me costó encontrar en qué dedo me servía más, pero después de dos salidas ya está.' }, { nombre: 'Sofía B.', fecha: '2026-10-09', estrellas: 5, perfil: 'Zapatillas nuevas', pack: 'Pack x20', texto: 'Compré zapatillas nuevas para mi 10K y tenía miedo de lastimarme. Usé las fundas desde la primera salida: cero ampollas. Los parches que vinieron de regalo me salvaron el talón.' }, { nombre: 'Pablo A.', fecha: '2026-10-03', estrellas: 5, verificada: true, perfil: 'Trabaja de pie', titulo: '8 horas de pie sin ardor', texto: 'Trabajo en un local y terminaba el día con los dedos rojos. Desde que uso los protectores llego a casa sin ese ardor. Son cómodos y no se despegan con el calor.' }, { nombre: 'Valeria T.', fecha: '2026-09-28', estrellas: 5, perfil: 'Running', pack: 'Pack x10', texto: 'Protegen muchísimo. Las uso en el segundo dedo y en el meñique, que eran los que más sufrían, y quedan perfectas. El envío llegó rápido.' }, { nombre: 'Nicolás P.', fecha: '2026-09-21', estrellas: 5, verificada: true, perfil: 'Corredor · 10K', pack: 'Pack x20', texto: 'Las lavo después de cada salida con agua y jabón y quedan como nuevas. Ya llevo más de un mes con el mismo par. El manual también está muy bueno, sobre todo el plan de 5K a 10K.' }, { nombre: 'Florencia D.', fecha: '2026-09-15', estrellas: 5, perfil: 'Senderismo', texto: 'Las usé en un viaje a Bariloche con caminatas de 6 horas. Ni una ampolla. Ya las tengo fijas en la mochila.' }, { nombre: 'Javier L.', fecha: '2026-09-08', estrellas: 5, verificada: true, perfil: 'Corredor', pack: 'Pack x20', texto: 'Cumplen lo que prometen. Las uso en todos los fondos largos del fin de semana. Ya le recomendé el Pack x20 a la mitad de mi grupo de running.' } ];</script>
